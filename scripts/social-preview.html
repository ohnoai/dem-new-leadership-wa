<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>DEM RESET social preview</title>
<style>
@font-face{font-family:Barlow;src:url('../assets/barlow-condensed-800.woff2');font-weight:800}
:root{--ink:#191a17;--paper:#f2f0e8;--citron:#d6fb35}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}
.poster{width:1280px;height:640px;overflow:hidden;padding:36px 56px 0;display:flex;flex-direction:column}
.mast{display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0}
.brand{font-size:38px;font-weight:900;letter-spacing:-2px;line-height:1}
.brand span{color:var(--citron)}
.washington{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;letter-spacing:3px}
.washington img{width:32px;height:32px}
.headline{font-family:Barlow,Impact,sans-serif;font-size:137px;font-weight:800;letter-spacing:-2px;line-height:.88;margin:25px 0 0}
.headline span,.ask span{display:block}
.headline span:last-child{color:var(--citron)}
.tagline{font-size:56px;letter-spacing:-2px;font-weight:700;line-height:1.06;margin:21px 0 0}
.ask{background:var(--paper);color:var(--ink);margin:auto -56px 0;padding:33px 56px 38px;font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.15;min-height:163px}
.ask span:last-child{font-size:38px;margin-top:9px}
</style>
<article class="poster" aria-label="DEM RESET split-field placard">
<div class="mast"><div class="brand">DEM<span> RESET</span></div><div class="washington"><img src="../assets/evergreen.svg" alt="">WASHINGTON</div></div>
<h1 class="headline"><span>DEMOCRATS NEED</span><span>A RESET.</span></h1>
<p class="tagline">New majority. New leadership.</p>
<p class="ask"><span>Replace Chuck Schumer and Hakeem Jeffries.</span><span>Tell Washington's delegation to back a change.</span></p>
</article>
</html>
